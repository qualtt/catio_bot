services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-catio_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bot_password}
      POSTGRES_DB: ${POSTGRES_DB:-catio_bot_db}
    # Tuned for a 1 GB server. No published port: only containers on this network reach it.
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - effective_cache_size=128MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - max_connections=20
    mem_limit: 256m
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-catio_bot} -d ${POSTGRES_DB:-catio_bot_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    # Holds aiogram FSM state, so it must never evict keys. No published port.
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 96m
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    restart: always
    mem_limit: 450m
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-catio_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bot_password}
      POSTGRES_DB: ${POSTGRES_DB:-catio_bot_db}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-catio_bot}:${POSTGRES_PASSWORD:-bot_password}@db:5432/${POSTGRES_DB:-catio_bot_db}
      TIMEZONE: ${TIMEZONE:-Europe/Moscow}
      DAILY_SLOT_TIMES: ${DAILY_SLOT_TIMES:-11:00}
      AUTO_POST_DAYS_AHEAD: ${AUTO_POST_DAYS_AHEAD:-30}
      PUBLISHER_POLL_INTERVAL_SECONDS: ${PUBLISHER_POLL_INTERVAL_SECONDS:-60}
      DUPLICATE_PHASH_MAX_DISTANCE: ${DUPLICATE_PHASH_MAX_DISTANCE:-8}
      SCORE_APPROVED_POST_BASE: ${SCORE_APPROVED_POST_BASE:-10}
      SCORE_AUTO_BONUS_PERCENT: ${SCORE_AUTO_BONUS_PERCENT:-50}
      SCORE_PENDING_POST_WEIGHT_PERCENT: ${SCORE_PENDING_POST_WEIGHT_PERCENT:-50}
      SCORE_DUPLICATE_EXACT_FACTOR_PERCENT: ${SCORE_DUPLICATE_EXACT_FACTOR_PERCENT:-0}
      SCORE_DUPLICATE_SIMILAR_FACTOR_PERCENT: ${SCORE_DUPLICATE_SIMILAR_FACTOR_PERCENT:-50}
      SCORE_OLD_PHOTO_CORRECT: ${SCORE_OLD_PHOTO_CORRECT:-2}
      SCORE_OLD_PHOTO_DAILY_CAP: ${SCORE_OLD_PHOTO_DAILY_CAP:-20}
      IDENTIFICATION_VOTES_REQUIRED: ${IDENTIFICATION_VOTES_REQUIRED:-1}
      IDENTIFICATION_CONSENSUS_PERCENT: ${IDENTIFICATION_CONSENSUS_PERCENT:-67}
      IDENTIFICATION_MAX_VOTES_PER_PHOTO: ${IDENTIFICATION_MAX_VOTES_PER_PHOTO:-7}
      IDENTIFICATION_ASSIGNMENT_TTL_MINUTES: ${IDENTIFICATION_ASSIGNMENT_TTL_MINUTES:-30}
      IDENTIFICATION_BATCH_SIZE: ${IDENTIFICATION_BATCH_SIZE:-10}
      IDENTIFICATION_MAX_ACTIVE_ASSIGNMENTS_PER_PHOTO: ${IDENTIFICATION_MAX_ACTIVE_ASSIGNMENTS_PER_PHOTO:-3}
      BOT_CONTENT_PATH: ${BOT_CONTENT_PATH:-/app/bot_content.json}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PREFIX: ${S3_PREFIX:-catio-bot/photos}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      API_ID: ${API_ID:-}
      API_HASH: ${API_HASH:-}
      USERBOT_SESSION_STRING: ${USERBOT_SESSION_STRING:-}
      USERBOT_SESSION_NAME: ${USERBOT_SESSION_NAME:-catio_importer}
    volumes:
      - ./bot_content.json:/app/bot_content.json
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  pgbackups:
    image: eeshugerman/postgres-backup-s3:15
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_DATABASE: ${POSTGRES_DB:-catio_bot_db}
      POSTGRES_USER: ${POSTGRES_USER:-catio_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bot_password}
      # Backups must live with a different provider than the server running the database.
      # By default they go to the photo S3; set BACKUP_S3_* to send them elsewhere.
      S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-${S3_ACCESS_KEY_ID:-}}
      S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-${S3_SECRET_ACCESS_KEY:-}}
      S3_BUCKET: ${BACKUP_S3_BUCKET:-${S3_BUCKET:-}}
      S3_REGION: ${BACKUP_S3_REGION:-${S3_REGION:-us-east-1}}
      S3_ENDPOINT: ${BACKUP_S3_ENDPOINT_URL:-${S3_ENDPOINT_URL:-}}
      S3_PREFIX: catio-bot/db-backups
      SCHEDULE: '@daily'
      BACKUP_KEEP_DAYS: 14
    mem_limit: 128m
    depends_on:
      db:
        condition: service_healthy

  # Nightly copy of the photo bucket onto the server's disk, so photos survive losing the S3 provider.
  photo-mirror:
    image: rclone/rclone:1.68.2
    restart: always
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          rclone sync "src:$${S3_BUCKET}/$${S3_PREFIX}" /mirror --s3-no-check-bucket --fast-list --log-level NOTICE && echo "photo mirror ok: $$(date -u +%FT%TZ)"
          sleep 86400
        done
    environment:
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-catio-bot/photos}
      RCLONE_CONFIG_SRC_TYPE: s3
      RCLONE_CONFIG_SRC_PROVIDER: Other
      RCLONE_CONFIG_SRC_ENDPOINT: ${S3_ENDPOINT_URL:-}
      RCLONE_CONFIG_SRC_REGION: ${S3_REGION:-us-east-1}
      RCLONE_CONFIG_SRC_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_SRC_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    mem_limit: 128m
    volumes:
      - ${PHOTO_MIRROR_DIR:-./backups/photos}:/mirror

volumes:
  pgdata:
  redisdata:
